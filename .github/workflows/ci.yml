name: CI

on:
  pull_request:
    branches: ["*"]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet code
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -v -race ./...

      - name: Build binary
        run: go build -v ./cmd/netmon
